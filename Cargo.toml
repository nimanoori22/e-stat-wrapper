[package]
name = "e-stat-wrapper"
version = "0.1.0"
edition = "2024"
description = "Async Rust client for Japan's e-Stat API v3 with typed CPI series and shared request limits"
license = "MIT"
repository = "https://github.com/nimanoori22/e-stat-wrapper"

[dependencies]
rustopus = "0.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["query", "gzip", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros"] }
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
wiremock = "0.6.5"
